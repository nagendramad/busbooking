version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: bus-booking-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: bus-booking-redis
    ports:
      - "6379:6379"

  auth-service:
    build: .
    container_name: auth-service
    ports:
      - "3001:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/bus-booking
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb

  booking-service:
    build: .
    container_name: booking-service
    ports:
      - "3002:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/bus-booking
    depends_on:
      - mongodb

  payment-service:
    build: .
    container_name: payment-service
    ports:
      - "3003:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/bus-booking
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    depends_on:
      - mongodb

  notification-service:
    build: .
    container_name: notification-service
    ports:
      - "3004:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/bus-booking
      - TWILIO_SID=${TWILIO_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
    depends_on:
      - mongodb

  ai-service:
    build: .
    container_name: ai-service
    ports:
      - "3005:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/bus-booking
    depends_on:
      - mongodb

  gps-tracking-service:
    build: .
    container_name: gps-tracking-service
    ports:
      - "3006:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/bus-booking
    depends_on:
      - mongodb

  analytics-service:
    build: .
    container_name: analytics-service
    ports:
      - "3007:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/bus-booking
    depends_on:
      - mongodb

  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/bus-booking
    depends_on:
      - mongodb

volumes:
  mongodb_data: